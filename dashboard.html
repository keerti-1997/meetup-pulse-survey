<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Women in AI — Pulse Survey Trends</title>
<style>
  :root {
    --bg: #0F1115; --surface: #171A20; --ink: #F2F3F5; --muted: #9AA3AE; --line: #262B33;
    --accent: #6C8CF5; --accent-ink: #DCE4FF; --accent-soft: rgba(108, 140, 245, 0.16);
    --accent2: #E0983F; --accent2-soft: rgba(224, 152, 63, 0.16);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    margin: 0; padding: 32px 18px 100px; line-height: 1.5;
  }
  .page { max-width: 640px; margin: 0 auto; }
  header.brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  header.brand .logo-chip { background: #FFFFFF; border-radius: 6px; padding: 5px 10px; line-height: 0; }
  header.brand img { height: 18px; width: auto; display: block; }
  header.brand .divider { width: 1px; height: 22px; background: var(--line); }
  header.brand .chapter { font-size: 13px; color: var(--muted); font-weight: 600; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14.5px; margin: 0 0 20px; }

  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  select {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; font-size: 14px;
  }

  .summary-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 18px; flex: 1; min-width: 130px;
  }
  .stat .num { font-size: 26px; font-weight: 800; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 14px;
  }
  .card h3 { font-size: 14.5px; margin: 0 0 12px; font-weight: 700; }
  .card .meta { font-size: 12px; color: var(--muted); margin: -8px 0 12px; }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-label { width: 38%; flex-shrink: 0; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; background: var(--line); border-radius: 4px; height: 10px; overflow: hidden; }
  .bar-fill { background: var(--accent); height: 100%; }
  .bar-fill.rotating { background: var(--accent2); }
  .bar-pct { width: 68px; flex-shrink: 0; text-align: right; color: var(--muted); font-family: var(--mono); font-size: 11.5px; }

  #empty { text-align: center; color: var(--muted); padding: 60px 20px; display: none; }
  #loading { text-align: center; color: var(--muted); padding: 60px 20px; }
</style>
</head>
<body>
<div class="page">
  <header class="brand">
    <span class="logo-chip"><img src="https://images.aitinkerers.org/blog_images/ai-tinkerers-logo-svg-e9v7.png" alt="AI Tinkerers"></span>
    <div class="divider"></div>
    <span class="chapter">Seattle · Women in AI</span>
  </header>
  <h1>Pulse Survey Trends</h1>
  <p class="sub">Aggregate view only — counts and percentages, never individual answers.</p>

  <div class="controls">
    <label for="event-filter" style="font-size:13px;color:var(--muted)">Event:</label>
    <select id="event-filter"><option value="">All time</option></select>
  </div>

  <div id="loading">Loading…</div>
  <div id="empty">No responses yet for this view.</div>
  <div id="content" style="display:none">
    <div class="summary-row">
      <div class="stat"><div class="num" id="stat-total">–</div><div class="label">Responses in view</div></div>
      <div class="stat"><div class="num" id="stat-nps">–</div><div class="label">NPS score</div></div>
      <div class="stat"><div class="num" id="stat-comfort">–</div><div class="label">Avg. agent-building comfort (1–5)</div></div>
    </div>
    <div id="question-cards"></div>
  </div>
</div>

<script>
  // Fill in per SETUP.md — same Apps Script deployment the survey uses.
  var PULSE_CONFIG = {
    APPS_SCRIPT_URL: 'PASTE_YOUR_DEPLOYED_WEB_APP_URL_HERE'
  };

  function jsonp(url, params, callback) {
    var cbName = 'jsonp_cb_' + Math.random().toString(36).slice(2);
    var script = document.createElement('script');
    var timeout = setTimeout(function () { cleanup(); callback({ ok: false, error: 'request timed out' }); }, 15000);
    function cleanup() {
      clearTimeout(timeout);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[cbName] = function (data) { cleanup(); callback(data); };
    var query = Object.keys(params)
      .map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]); })
      .join('&');
    script.src = url + '?' + query + '&callback=' + cbName;
    script.onerror = function () { cleanup(); callback({ ok: false, error: 'network error' }); };
    document.body.appendChild(script);
  }

  // Mirrors QUESTIONS in index.html — keep display text/options/order in sync
  // when rotating questions change. Only used for labeling; the actual
  // aggregation happens server-side in Code.gs.
  var QUESTION_META = [
    { key: 'q1_role', text: "Current role", options: ['SWE', 'Data Scientist / ML Engineer', 'PM', 'Founder / Exec', 'Student', 'Designer', 'Researcher', 'Other'] },
    { key: 'q2_industry', text: 'Industry', options: null },
    { key: 'q3_years', text: 'Years in tech', options: ['<1', '1–3', '4–7', '8–15', '15+'] },
    { key: 'q4_employment', text: 'Employment status', options: ['Employed full-time', 'Freelance / contract', 'Between roles', 'Student', 'Founder'] },
    { key: 'q5_tools', text: 'AI tools used weekly', options: ['ChatGPT', 'Claude', 'Gemini', 'Copilot', 'Cursor', 'Perplexity', 'Image/video gen', 'Other'] },
    { key: 'q6_agent_count', text: 'Agents/tools in regular workflow', options: ['0', '1–2', '3–5', '6–10', '10+'] },
    { key: 'q7_agent_use', text: 'Main use for AI agents', options: ['Coding', 'Writing', 'Research', 'Data analysis', 'Automation/ops', 'Image/video', 'Customer-facing product'] },
    { key: 'q8_tool_ownership', text: 'Tool ownership', options: ['Personal', 'Employer-provided', 'Both'] },
    { key: 'q11_first_meetup', text: 'First Women in AI meetup?', options: ['Yes', 'No'] },
    { key: 'q12_brought_here', text: 'What brought you here', options: ['Networking', 'Learning', 'Job search', 'Speaking/sharing', 'Mentorship'] },
    { key: 'q14_openweight', text: 'Tried an open-weight model this month?', options: ['Yes', 'No', 'Not sure what that means'], rotating: true }
  ];

  var byEventData = [];

  function load(eventDate) {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('content').style.display = 'none';
    document.getElementById('empty').style.display = 'none';

    var params = { action: 'trends' };
    if (eventDate) params.event_date = eventDate;

    jsonp(PULSE_CONFIG.APPS_SCRIPT_URL, params, function (res) {
      document.getElementById('loading').style.display = 'none';
      if (!res.ok) {
        document.getElementById('loading').textContent = 'Could not load trends: ' + (res.error || 'unknown error');
        document.getElementById('loading').style.display = 'block';
        return;
      }

      if (!eventDate) {
        byEventData = res.byEvent || [];
        populateEventFilter();
      }

      var total = eventDate
        ? (byEventData.filter(function (e) { return e.event_date === eventDate; })[0] || {}).count || 0
        : res.totalResponses;

      if (!total) {
        document.getElementById('empty').style.display = 'block';
        return;
      }

      document.getElementById('content').style.display = 'block';
      document.getElementById('stat-total').textContent = total;

      var nps = res.questions.q13_nps;
      document.getElementById('stat-nps').textContent = nps && nps.count ? nps.npsScore : '–';

      var comfort = res.questions.q9_comfort;
      document.getElementById('stat-comfort').textContent = comfort && comfort.count ? comfort.average.toFixed(1) : '–';

      renderQuestionCards(res.questions);
    });
  }

  function populateEventFilter() {
    var select = document.getElementById('event-filter');
    var current = select.value;
    select.innerHTML = '<option value="">All time</option>' + byEventData.map(function (e) {
      return '<option value="' + e.event_date + '">' + e.event_date + ' (' + e.count + ')</option>';
    }).join('');
    select.value = current;
  }

  function renderQuestionCards(questions) {
    var container = document.getElementById('question-cards');
    container.innerHTML = '';

    QUESTION_META.forEach(function (meta) {
      var q = questions[meta.key];
      if (!q || !q.count) return;

      var card = document.createElement('div');
      card.className = 'card';
      var optionOrder = meta.options || Object.keys(q.counts).sort(function (a, b) { return q.counts[b] - q.counts[a]; });

      var bars = optionOrder.map(function (opt) {
        var count = q.counts[opt] || 0;
        var pct = q.count ? Math.round((count / q.count) * 100) : 0;
        return '<div class="bar-row">' +
          '<div class="bar-label">' + opt + '</div>' +
          '<div class="bar-track"><div class="bar-fill' + (meta.rotating ? ' rotating' : '') + '" style="width:' + pct + '%"></div></div>' +
          '<div class="bar-pct">' + count + ' · ' + pct + '%</div>' +
          '</div>';
      }).join('');

      card.innerHTML = '<h3>' + meta.text + (meta.rotating ? ' <span style="color:var(--accent2);font-weight:400">· this month</span>' : '') + '</h3>' +
        '<div class="meta">' + q.count + ' response' + (q.count === 1 ? '' : 's') + '</div>' + bars;
      container.appendChild(card);
    });
  }

  document.getElementById('event-filter').addEventListener('change', function (e) {
    load(e.target.value || null);
  });

  load(null);
</script>
</body>
</html>
